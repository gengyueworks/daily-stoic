name: Daily Stoic Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily pick
        run: python3 scripts/daily_pick.py

      - name: Commit and push
        run: |
          git config user.name "daily-stoic-bot"
          git config user.email "daily-stoic-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily Stoic $(date +%F)"
            git push
          fi
